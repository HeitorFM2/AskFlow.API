name: Release

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

env:
  APP_NAME: api-askflow

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test AskFlow.Tests/AskFlow.Tests.csproj --no-build --configuration Release

      - name: Install EF tool
        run: dotnet tool install --global dotnet-ef --version 10.0.*

      - name: Generate migration bundle
        env:
          JwtSettings__SecretKey: ${{ secrets.JWT_SECRET_KEY }}
          ConnectionStrings__DefaultConnection: ${{ secrets.SQL_CONNECTION_STRING }}
        run: |
          dotnet ef migrations bundle \
            --project AskFlow.Infrastructure \
            --startup-project AskFlow.WebAPI \
            --self-contained \
            --target-runtime linux-x64 \
            --output ${{ github.workspace }}/efbundle \
            --configuration Release

      - name: Publish app
        run: dotnet publish AskFlow.WebAPI/AskFlow.WebAPI.csproj -c Release -o ${{ github.workspace }}/publish --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: efbundle
          path: efbundle

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: publish

  migrate:
    name: Apply migrations
    needs: build
    runs-on: ubuntu-latest
    environment: production-migrations

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: efbundle

      - name: Apply
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.SQL_CONNECTION_STRING }}
        run: |
          chmod +x ./efbundle
          ./efbundle --connection "$ConnectionStrings__DefaultConnection"

  deploy:
    name: Deploy to production
    needs: migrate
    runs-on: windows-latest
    environment: production

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
